<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Index</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-color: #ffffff;
            --accent-color: #00d2ff;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .search-wrapper {
            max-width: 400px;
            margin: 0 auto;
            position: relative;
        }

        input#search {
            width: 100%;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box; /* Fix padding calculation */
        }

        input#search::placeholder {
            color: rgba(255,255,255,0.6);
        }

        /* Grid Layout */
        .category-section {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            display: inline-block;
            color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Glass Cards */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease, background 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: var(--glass-shadow);
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent-color);
        }

        .icon-box {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .card-path {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 5px;
        }

        /* Loading State */
        #loader {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-layer-group"></i> Dream AI Project Portal</h1>
            <div class="search-wrapper">
                <input type="text" id="search" placeholder="Filter files...">
            </div>
        </header>

        <div id="content">
            <div id="loader">Loading content...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contentDiv = document.getElementById('content');
            const searchInput = document.getElementById('search');
            let allFiles = [];

            // Fetch the JSON generated by Python
            fetch('files.json')
                .then(response => {
                    if (!response.ok) throw new Error("Could not find files.json");
                    return response.json();
                })
                .then(data => {
                    allFiles = data;
                    renderFiles(allFiles);
                })
                .catch(err => {
                    contentDiv.innerHTML = `<div style="text-align:center; color: #ff6b6b;">
                        Error: ${err.message}.<br> Did you run the python script?
                    </div>`;
                });

            // Filter functionality
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allFiles.filter(file =>
                    file.name.toLowerCase().includes(term) ||
                    file.category.toLowerCase().includes(term)
                );
                renderFiles(filtered);
            });

            function renderFiles(files) {
                if (files.length === 0) {
                    contentDiv.innerHTML = '<div id="loader">No files found.</div>';
                    return;
                }

                // Group by Category
                const categories = {};
                files.forEach(file => {
                    if (!categories[file.category]) categories[file.category] = [];
                    categories[file.category].push(file);
                });

                contentDiv.innerHTML = '';

                // Build HTML
                for (const [categoryName, items] of Object.entries(categories)) {
                    const section = document.createElement('div');
                    section.className = 'category-section';

                    const title = document.createElement('h2');
                    title.className = 'category-title';
                    title.textContent = categoryName;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'grid';

                    items.forEach(item => {
                        let iconClass = 'fa-folder'; // Default icon
                            if (item.type === 'game') iconClass = 'fa-gamepad';
                            else if (item.type === 'toy') iconClass = 'fa-puzzle-piece';
                            else if (item.type === 'music') iconClass = 'fa-music';
                            else if (item.type === 'tool') iconClass = 'fa-wrench';

                        const card = document.createElement('a');
                        card.href = item.path;
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="icon-box"><i class="fa-solid ${iconClass}"></i></div>
                            <div class="card-title">${item.name}</div>
                            <div class="card-path">/${item.path}</div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    contentDiv.appendChild(section);
                }
            }
        });
    </script>
</body>
</html>
