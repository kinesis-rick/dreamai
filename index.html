<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream AI | Interactive App Portal & Playground</title>
    <meta name="description" content="Explore a collection of interactive HTML5 games, productivity tools, physics toys, and audio experiences.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-dark: #080914;
            --bg-card: rgba(18, 20, 39, 0.55);
            --bg-card-hover: rgba(28, 31, 60, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(168, 85, 247, 0.4);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            
            --accent-game: #a855f7;
            --accent-tool: #06b6d4;
            --accent-toy: #f43f5e;
            --accent-music: #f59e0b;
            
            --grad-game: linear-gradient(135deg, #a855f7, #6366f1);
            --grad-tool: linear-gradient(135deg, #06b6d4, #3b82f6);
            --grad-toy: linear-gradient(135deg, #f43f5e, #fb7185);
            --grad-music: linear-gradient(135deg, #f59e0b, #ec4899);
            --grad-primary: linear-gradient(135deg, #a855f7, #06b6d4, #3b82f6);
            
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-glow: 0 10px 40px -10px rgba(168, 85, 247, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.5;
        }

        /* Canvas Particle Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Background Ambient Glows */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.18;
            pointer-events: none;
            z-index: -1;
            animation: pulseGlow 12s ease-in-out infinite alternate;
        }

        .glow-1 {
            top: -200px;
            left: -100px;
            background: #7c3aed;
        }

        .glow-2 {
            bottom: -200px;
            right: -100px;
            background: #0284c7;
            animation-delay: -6s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.15; }
            100% { transform: scale(1.15) translate(40px, 30px); opacity: 0.25; }
        }

        .app-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px 32px 60px 32px;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(13, 15, 30, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: 40px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--grad-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #fff;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .nav-link-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Hero Banner */
        .hero {
            text-align: center;
            padding: 30px 20px 40px 20px;
            max-width: 860px;
            margin: 0 auto 36px auto;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #c084fc;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hero-badge i {
            font-size: 0.75rem;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 18px;
            letter-spacing: -1px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 640px;
            margin: 0 auto 32px auto;
            font-weight: 400;
        }

        /* Controls Section (Search & Quick Action) */
        .search-container {
            max-width: 620px;
            margin: 0 auto;
            position: relative;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            color: var(--text-dim);
            font-size: 1.1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .search-input {
            width: 100%;
            padding: 16px 110px 16px 52px;
            background: rgba(15, 17, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .search-input:focus {
            border-color: var(--accent-game);
            background: rgba(20, 23, 48, 0.95);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .search-input:focus ~ .search-icon {
            color: var(--accent-game);
        }

        .search-clear {
            position: absolute;
            right: 75px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 8px;
            display: none;
        }

        .search-clear:hover {
            color: #fff;
        }

        .search-kbd {
            position: absolute;
            right: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            pointer-events: none;
        }

        /* Filter Controls & Stats Bar */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .category-pills {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .pill-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .pill-btn.active {
            color: #fff;
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--accent-game);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
        }

        .pill-btn[data-cat="Games"].active {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent-game);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .pill-btn[data-cat="Tools"].active {
            background: rgba(6, 182, 212, 0.2);
            border-color: var(--accent-tool);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }

        .pill-btn[data-cat="Toys"].active {
            background: rgba(244, 63, 94, 0.2);
            border-color: var(--accent-toy);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.3);
        }

        .pill-btn[data-cat="Music"].active {
            background: rgba(245, 158, 11, 0.2);
            border-color: var(--accent-music);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .pill-count {
            padding: 2px 7px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .pill-btn.active .pill-count {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .action-tools {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .random-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(6, 182, 212, 0.2));
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .random-btn:hover {
            transform: translateY(-2px);
            border-color: #a855f7;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
        }

        /* Category Section Headers */
        .category-group {
            margin-bottom: 48px;
        }

        .group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .group-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .group-badge-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
        }

        .cat-Games .group-badge-icon { background: var(--grad-game); }
        .cat-Tools .group-badge-icon { background: var(--grad-tool); }
        .cat-Toys .group-badge-icon { background: var(--grad-toy); }
        .cat-Music .group-badge-icon { background: var(--grad-music); }

        .group-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .group-count {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        /* Card Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* Glass Experience Cards */
        .card {
            position: relative;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.35s ease;
            opacity: 0.6;
        }

        .card[data-type="game"]::before { background: var(--grad-game); }
        .card[data-type="tool"]::before { background: var(--grad-tool); }
        .card[data-type="toy"]::before { background: var(--grad-toy); }
        .card[data-type="music"]::before { background: var(--grad-music); }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.5);
        }

        .card[data-type="game"]:hover { border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 12px 32px -10px rgba(168, 85, 247, 0.25); }
        .card[data-type="tool"]:hover { border-color: rgba(6, 182, 212, 0.4); box-shadow: 0 12px 32px -10px rgba(6, 182, 212, 0.25); }
        .card[data-type="toy"]:hover { border-color: rgba(244, 63, 94, 0.4); box-shadow: 0 12px 32px -10px rgba(244, 63, 94, 0.25); }
        .card[data-type="music"]:hover { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 12px 32px -10px rgba(245, 158, 11, 0.25); }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .card-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .card[data-type="game"] .card-icon-wrapper { color: #c084fc; }
        .card[data-type="tool"] .card-icon-wrapper { color: #38bdf8; }
        .card[data-type="toy"] .card-icon-wrapper { color: #fb7185; }
        .card[data-type="music"] .card-icon-wrapper { color: #fbbf24; }

        .card:hover .card-icon-wrapper {
            transform: scale(1.1) rotate(4deg);
        }

        .card[data-type="game"]:hover .card-icon-wrapper { background: var(--grad-game); color: #fff; border-color: transparent; }
        .card[data-type="tool"]:hover .card-icon-wrapper { background: var(--grad-tool); color: #fff; border-color: transparent; }
        .card[data-type="toy"]:hover .card-icon-wrapper { background: var(--grad-toy); color: #fff; border-color: transparent; }
        .card[data-type="music"]:hover .card-icon-wrapper { background: var(--grad-music); color: #fff; border-color: transparent; }

        .card-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
            color: #fff;
        }

        .card-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .card-path-tag {
            font-family: monospace;
            opacity: 0.7;
        }

        .card-launch-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: var(--text-muted);
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .card:hover .card-launch-btn {
            color: #fff;
            transform: translateX(3px);
        }

        /* Empty / No Results state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(18, 20, 39, 0.4);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border-color);
            margin: 40px 0;
        }

        .empty-icon {
            font-size: 3rem;
            color: var(--text-dim);
            margin-bottom: 16px;
        }

        .empty-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .empty-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Preview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 6, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            background: #0f1123;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .modal-close-btn {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fb7185;
        }

        .modal-close-btn:hover {
            background: #f43f5e;
            color: #fff;
        }

        .modal-body {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        .modal-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Footer */
        footer {
            margin-top: 60px;
            padding: 24px 0;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-dim);
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .footer-link {
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--text-main);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .app-container {
                padding: 16px 16px 40px 16px;
            }

            .hero-title {
                font-size: 2.2rem;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .category-pills {
                overflow-x: auto;
                padding-bottom: 6px;
                white-space: nowrap;
                flex-wrap: nowrap;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

<body>

    <!-- Ambient Glowing Nebulae -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Particle Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <!-- Top Navbar -->
        <nav class="navbar">
            <a href="#" class="brand-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div class="brand-title">DREAM AI</div>
            </a>
        </nav>

        <!-- Hero Section -->
        <header class="hero">
            <div class="hero-badge">
                <i class="fa-solid fa-sparkles"></i> Dream AI Portal & Experiences
            </div>
            <h1 class="hero-title">
                Explore <span class="gradient-text">Interactive Apps</span> & Creative Toys
            </h1>
            <p class="hero-subtitle">
                A curated showcase of HTML5 web games, productivity tools, visual audio players, and physics simulations built by Dream AI.
            </p>

            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search" class="search-input" placeholder="Search experiences, games, tools..." autocomplete="off">

                    <span class="search-kbd">Ctrl K</span>

        <!-- Category Filters & Stats -->
        <div class="filter-bar">
            <div class="category-pills" id="category-pills">
                <button class="pill-btn active" data-cat="All">
                    <i class="fa-solid fa-border-all"></i> All <span class="pill-count" id="count-all">0</span>

                <button class="pill-btn" data-cat="Games">
                    <i class="fa-solid fa-gamepad"></i> Games <span class="pill-count" id="count-games">0</span>
                </button>
                <button class="pill-btn" data-cat="Tools">
                    <i class="fa-solid fa-wrench"></i> Tools <span class="pill-count" id="count-tools">0</span>
                </button>
                <button class="pill-btn" data-cat="Toys">
                    <i class="fa-solid fa-puzzle-piece"></i> Toys <span class="pill-count" id="count-toys">0</span>
                </button>
                <button class="pill-btn" data-cat="Music">
                    <i class="fa-solid fa-compact-disc"></i> Music <span class="pill-count" id="count-music">0</span>
                </button>
            </div>

                    <i class="fa-solid fa-dice"></i> Surprise Me

    <!-- Preview Modal -->
    <div class="modal-overlay" id="modal-overlay">

                    <span class="modal-title" id="modal-title">App Preview</span>
                </div>
                <div class="modal-actions">
                    <a href="#" target="_blank" id="modal-open-newtab" class="modal-btn">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Full Tab
                    </a>
                    <button class="modal-btn modal-close-btn" id="modal-close-btn">
                        <i class="fa-solid fa-xmark"></i> Close
                    </button>

            </div>
            <div class="modal-body">
                <iframe id="modal-iframe" class="modal-iframe" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contentDiv = document.getElementById('content');
            const searchInput = document.getElementById('search');
            const searchClearBtn = document.getElementById('search-clear');
            const categoryPills = document.getElementById('category-pills');
            const randomBtn = document.getElementById('random-btn');
            
            // Modal Elements
            const modalOverlay = document.getElementById('modal-overlay');
            const modalTitle = document.getElementById('modal-title');
            const modalIframe = document.getElementById('modal-iframe');
            const modalOpenNewTab = document.getElementById('modal-open-newtab');
            const modalCloseBtn = document.getElementById('modal-close-btn');

            let allFiles = [];
            let activeCategory = 'All';
            let searchQuery = '';

            // 1. Fetch JSON data with inline fallback
            fetch('./files.json', { cache: 'no-cache' })
                .then(res => {
                    if (!res.ok) throw new Error("Unable to load files.json (Status " + res.status + ")");
                    return res.json();
                })
                .then(data => {
                    allFiles = data;
                    updateCounts(allFiles);
                    render();
                })
                .catch(err => {
                    console.warn("Fetch files.json failed/blocked, checking fallback:", err);
                    if (window.PORTAL_FILES && Array.isArray(window.PORTAL_FILES) && window.PORTAL_FILES.length > 0) {
                        allFiles = window.PORTAL_FILES;
                        updateCounts(allFiles);
                        render();
                    } else {
                        contentDiv.innerHTML = `
                            <div class="empty-state">
                                <i class="fa-solid fa-triangle-exclamation empty-icon" style="color: #f43f5e;"></i>
                                <div class="empty-title">Error Loading Portal Content</div>
                                <div class="empty-desc">${err.message}. Please run <code>python3 generate_index.py</code>.</div>
                            </div>`;
                    }
                });

            // 2. Update pill counts
            function updateCounts(files) {
                const counts = { All: files.length, Games: 0, Tools: 0, Toys: 0, Music: 0 };
                files.forEach(f => {
                    if (counts[f.category] !== undefined) {
                        counts[f.category]++;
                    }
                });

                document.getElementById('count-all').textContent = counts.All;
                document.getElementById('count-games').textContent = counts.Games;
                document.getElementById('count-tools').textContent = counts.Tools;
                document.getElementById('count-toys').textContent = counts.Toys;
                document.getElementById('count-music').textContent = counts.Music;
                document.getElementById('item-total-status').textContent = `${counts.All} Experiences Ready`;
            }

            // 3. Render Content
            function render() {
                // Filter by category and search term
                const filtered = allFiles.filter(item => {
                    const matchesCategory = (activeCategory === 'All' || item.category === activeCategory);
                    const matchesSearch = searchQuery === '' || 
                        item.name.toLowerCase().includes(searchQuery) ||
                        item.description.toLowerCase().includes(searchQuery) ||
                        item.category.toLowerCase().includes(searchQuery) ||
                        item.path.toLowerCase().includes(searchQuery);
                    
                    return matchesCategory && matchesSearch;
                });

                if (filtered.length === 0) {
                    contentDiv.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-magnifying-glass empty-icon"></i>
                            <div class="empty-title">No Matching Experiences Found</div>
                            <div class="empty-desc">Try searching for something else or switch category tabs.</div>
                        </div>`;
                    return;
                }

                // Group items by category
                const groups = {};
                filtered.forEach(item => {
                    if (!groups[item.category]) groups[item.category] = [];
                    groups[item.category].push(item);
                });

                contentDiv.innerHTML = '';

                // Render group by group
                const categoryOrder = ['Games', 'Tools', 'Toys', 'Music'];
                const sortedCategories = Object.keys(groups).sort((a, b) => {
                    return categoryOrder.indexOf(a) - categoryOrder.indexOf(b);
                });

                sortedCategories.forEach(cat => {
                    const items = groups[cat];
                    const groupContainer = document.createElement('div');
                    groupContainer.className = `category-group cat-${cat}`;

                    let catIcon = 'fa-cubes';
                    if (cat === 'Games') catIcon = 'fa-gamepad';
                    else if (cat === 'Tools') catIcon = 'fa-wrench';
                    else if (cat === 'Toys') catIcon = 'fa-puzzle-piece';
                    else if (cat === 'Music') catIcon = 'fa-compact-disc';

                    groupContainer.innerHTML = `
                        <div class="group-header">
                            <div class="group-title-wrap">
                                <div class="group-badge-icon"><i class="fa-solid ${catIcon}"></i></div>
                                <h2 class="group-title">${cat}</h2>
                            </div>
                            <span class="group-count">${items.length} ${items.length === 1 ? 'item' : 'items'}</span>
                        </div>
                    `;

                    const grid = document.createElement('div');
                    grid.className = 'grid';

                    items.forEach(item => {
                        const card = document.createElement('a');
                        card.href = item.path;
                        card.className = 'card';
                        card.setAttribute('data-type', item.type);
                        card.innerHTML = `
                            <div>
                                <div class="card-top">
                                    <div class="card-icon-wrapper">
                                        <i class="fa-solid ${item.icon || 'fa-compass'}"></i>
                                    </div>
                                    <span class="card-badge">${item.category}</span>
                                </div>
                                <h3 class="card-title">${item.name}</h3>
                                <p class="card-desc">${item.description}</p>
                            </div>
                            <div class="card-footer">
                                <span class="card-path-tag">/${item.path}</span>
                                <span class="card-launch-btn">Launch <i class="fa-solid fa-arrow-right"></i></span>
                            </div>
                        `;

                        // Optional: Shift+Click or Middle Click opens modal preview, standard click opens app directly
                        card.addEventListener('click', (e) => {
                            if (e.altKey || e.ctrlKey || e.metaKey) {
                                e.preventDefault();
                                openPreviewModal(item.name, item.path);
                            }
                        });

                        grid.appendChild(card);
                    });

                    groupContainer.appendChild(grid);
                    contentDiv.appendChild(groupContainer);
                });
            }

            // 4. Search Listeners
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                searchClearBtn.style.display = searchQuery ? 'block' : 'none';
                render();
            });

            searchClearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                searchClearBtn.style.display = 'none';
                searchInput.focus();
                render();
            });

            // Global Keyboard Shortcut for Search (Ctrl+K or /)
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    searchInput.focus();
                } else if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                } else if (e.key === 'Escape') {
                    if (modalOverlay.classList.contains('active')) {
                        closePreviewModal();
                    } else if (document.activeElement === searchInput) {
                        searchInput.blur();
                    }
                }
            });

            // 5. Category Pill Filter Listeners
            categoryPills.addEventListener('click', (e) => {
                const btn = e.target.closest('.pill-btn');
                if (!btn) return;

                document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                activeCategory = btn.getAttribute('data-cat');
                render();
            });

            // 6. Random Surprise Me Button
            randomBtn.addEventListener('click', () => {
                if (allFiles.length === 0) return;
                const randomItem = allFiles[Math.floor(Math.random() * allFiles.length)];
                window.location.href = randomItem.path;
            });

            // 7. Modal Preview Handler
            function openPreviewModal(title, path) {
                modalTitle.textContent = title;
                modalIframe.src = path;
                modalOpenNewTab.href = path;
                modalOverlay.classList.add('active');
            }

            function closePreviewModal() {
                modalOverlay.classList.remove('active');
                modalIframe.src = 'about:blank';
            }

            modalCloseBtn.addEventListener('click', closePreviewModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closePreviewModal();
            });

            // 8. Particle Canvas Background Engine
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            let particles = [];

            function resizeCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.4;
                    this.radius = Math.random() * 1.5 + 0.5;
                    this.alpha = Math.random() * 0.4 + 0.1;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(168, 85, 247, ${this.alpha})`;
                    ctx.fill();
                }
            }

            // Create particle field
            const particleCount = Math.min(Math.floor(window.innerWidth / 20), 60);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function animateCanvas() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();

                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(168, 85, 247, ${0.15 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(animateCanvas);
            }

            animateCanvas();
        });
    </script>
