let _seed=(Date.now()&0xffffffff)>>>0;
function srand(s){_seed=s>>>0;}
function rnd(){_seed^=_seed<<13;_seed>>>=0;_seed^=_seed>>17;_seed^=_seed<<5;_seed>>>=0;return _seed/4294967296;}
function rr(a,b){return a+rnd()*(b-a);}
function ri(a,b){return Math.floor(rr(a,b+1));}
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

const AC={ctx:null,noiseBuf:null,last:{}};
function actx(){
 if(!AC.ctx){
  try{AC.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC.ctx=null;}
 }
 if(AC.ctx&&AC.ctx.state==='suspended')AC.ctx.resume();
 return AC.ctx;
}
function tone(type,f0,f1,dur,vol,delay){
 const a=actx();if(!a)return;
 const t=a.currentTime+(delay||0);
 const o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t);
 if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);
}
function noiseS(dur,vol,fc,delay){
 const a=actx();if(!a)return;
 if(!AC.noiseBuf){
  const len=a.sampleRate*0.5,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  AC.noiseBuf=b;
 }
 const t=a.currentTime+(delay||0);
 const s=a.createBufferSource();s.buffer=AC.noiseBuf;s.loop=true;
 const g=a.createGain(),f=a.createBiquadFilter();
 f.type='lowpass';f.frequency.value=fc||3000;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+0.02);
}
function sfx(k){
 const now=performance.now();
 if(AC.last[k]&&now-AC.last[k]<50)return;
 AC.last[k]=now;
 switch(k){
  case 'ar':noiseS(0.05,0.16,4000);tone('square',230,90,0.06,0.12);break;
  case 'smg':noiseS(0.04,0.1,4500);tone('square',300,140,0.04,0.08);break;
  case 'pistol':tone('square',340,130,0.06,0.12);break;
  case 'shotgun':noiseS(0.2,0.3,1800);tone('triangle',110,40,0.25,0.25);break;
  case 'sniper':noiseS(0.3,0.25,2500);tone('triangle',150,35,0.5,0.3);break;
  case 'hit':tone('triangle',700,500,0.05,0.1);break;
  case 'crit':tone('triangle',900,600,0.07,0.14);break;
  case 'kill':tone('sawtooth',320,70,0.25,0.2);break;
  case 'hurt':tone('sawtooth',180,90,0.12,0.16);break;
  case 'chest':[440,560,700,880].forEach((f,i)=>tone('square',f,f,0.09,0.12,i*0.07));break;
  case 'pickup':tone('square',660,880,0.06,0.1);break;
  case 'fruit':tone('triangle',520,640,0.08,0.12);break;
  case 'potion':tone('sine',280,760,0.35,0.14);break;
  case 'med':tone('sine',360,520,0.5,0.14);break;
  case 'build':tone('square',170,140,0.06,0.12);break;
  case 'deny':tone('square',140,90,0.08,0.12);break;
  case 'break':noiseS(0.14,0.2,1200);tone('triangle',160,60,0.12,0.12);break;
  case 'harvest':tone('triangle',220,180,0.06,0.12);noiseS(0.04,0.08,900);break;
  case 'swing':noiseS(0.06,0.06,700);break;
  case 'reload':tone('square',500,380,0.05,0.08);tone('square',380,500,0.05,0.08,0.12);break;
  case 'empty':tone('square',200,160,0.04,0.08);break;
  case 'jump':tone('sine',300,420,0.07,0.05);break;
  case 'land':tone('triangle',130,70,0.08,0.1);break;
  case 'eject':noiseS(0.25,0.12,1000);tone('sine',500,180,0.3,0.08);break;
  case 'horn':tone('sawtooth',310,310,0.5,0.16);tone('sawtooth',392,392,0.5,0.16);break;
  case 'siren':tone('sawtooth',220,440,0.7,0.12);tone('sawtooth',440,220,0.7,0.12,0.7);break;
  case 'win':[523,659,784,1046,1318].forEach((f,i)=>tone('triangle',f,f,0.28,0.2,i*0.16));break;
  case 'lose':tone('sawtooth',240,55,1.3,0.2);break;
  case 'swap':tone('square',420,560,0.05,0.08);break;
 }
}

const keys={};
const mouse={x:SW/2,y:SH/2,wx:0,wy:0,l:false,r:false,lEdge:false,rEdge:false};

addEventListener('keydown',e=>{
 if(e.repeat)return;
 keys[e.code]=true;
  if(rebindA&&(state==='pause'||(state==='menu'&&menuSettings))){
   if(e.code==='Backspace'){
    BINDS[rebindA][rebindSlot]=null;
    saveBinds();rebuildBoundCodes();
    rebindA=null;rebindSlot=-1;sfx('empty');
   }
   else if(e.code==='Escape'){rebindA=null;rebindSlot=-1;}
   else{
    const dup=new Set();
    for(const k in BINDS){if(k!==rebindA)BINDS[k]=BINDS[k].filter(c=>c!==e.code);}
    BINDS[rebindA][rebindSlot]=e.code;
    saveBinds();rebuildBoundCodes();
    rebindA=null;rebindSlot=-1;sfx('pickup');
   }
   e.preventDefault();
   return;
  }
 if(settingsSub==='adminpw'&&((state==='menu'&&menuSettings)||(state==='pause'&&pauseTab==='settings'))){
  if(e.code==='Escape'){
   adminPwBuf='';adminPwErr='';settingsSub=null;
   e.preventDefault();return;
  }
  else if(e.code==='Enter'||e.code==='NumpadEnter'){
   if(adminPwBuf==='TIger65%'){settingsSub='admin';sfx('win');}
   else{adminPwErr='WRONG PASSWORD';sfx('empty');}
   adminPwBuf='';
  }
  else if(e.code==='Backspace'){
   adminPwBuf=adminPwBuf.slice(0,-1);adminPwErr='';
  }
  else if(e.key&&e.key.length===1&&!e.ctrlKey&&!e.altKey&&adminPwBuf.length<24){
   adminPwBuf+=e.key;adminPwErr='';
  }
  else if(e.code==='Tab'){e.preventDefault();return;}
  e.preventDefault();return;
 }
 if(settingsSub==='party'&&!net.role&&((state==='menu'&&menuSettings)||(state==='pause'&&pauseTab==='settings'))){
  const typing=hostNaming?hostTyping:partyTyping;
  if(typing){
   if(e.code==='Escape'){
    if(hostNaming)hostTyping=false;else partyTyping=false;
    e.preventDefault();return;
   }
   else{
    let buf=hostNaming?hostBuf:partyBuf;
    if(e.code==='Enter'||e.code==='NumpadEnter'){
     if(!net.busy){if(hostNaming)netHostStart(hostBuf);else if(partyBuf.length>=2)netJoinStart(partyBuf);}
    }
    else if(e.code==='Backspace')buf=buf.slice(0,-1);
    else if(/^Key[A-Z]$/.test(e.code)||/^Digit\d$/.test(e.code)){
     if(buf.length<6)buf+=e.key.toUpperCase();
    }
    if(hostNaming)hostBuf=buf;else partyBuf=buf;
    e.preventDefault();
    return;
   }
  }
 }
 if(nameOpen&&nameTyping&&state==='menu'&&!menuSettings){
  if(e.code==='Escape'){nameTyping=false;}
  else if(e.code==='Enter'||e.code==='NumpadEnter'){nameTyping=false;}
  else if(e.code==='Backspace'){
   nameBuf=nameBuf.slice(0,-1);myName=cleanName(nameBuf);saveName();
  }
  else if(/^Key[A-Z]$/.test(e.code)||/^Digit\d$/.test(e.code)||e.code==='Space'){
   if(nameBuf.length<15){
    nameBuf+=(e.code==='Space'?' ':e.key.toUpperCase());
    myName=cleanName(nameBuf);saveName();
   }
  }
   else if(e.code!=='Tab'&&e.key.length===1&&!e.ctrlKey&&!e.altKey){
    if(nameBuf.length<15){nameBuf+=e.key;myName=cleanName(nameBuf);saveName();}
   }
   else{e.preventDefault();return;}
  e.preventDefault();
  return;
 }
 if(e.code==='Escape'){
   if(state==='menu'){
    if(menuSettings){
     if(rebindA){rebindA=null;rebindSlot=-1;}
     else menuSettings=false;
     }else if(nameOpen){nameOpen=false;}
     else if(shopOpen){shopOpen=false;}
     else if(achOpen){achOpen=false;}
     else if(lockerOpen){lockerOpen=false;}
    else if(careerOpen){careerOpen=false;}
    else if(modeOpen){modeOpen=false;}
    else{
     menuSettings=true;settingsSub=null;rebindA=null;rebindSlot=-1;sfx('swap');
    }
    e.preventDefault();
    return;
   }
  if(state==='play'||state==='drop'){pausePrev=state;state='pause';pauseTab='main';settingsSub=null;rebindA=null;rebindSlot=-1;sfx('swap');}
  else if(state==='pause'){
   if(rebindA){rebindA=null;rebindSlot=-1;}
   else if(pauseTab==='settings'&&settingsSub){settingsSub=null;}
   else if(pauseTab==='settings'){pauseTab='main';}
   else state=pausePrev||'play';
   sfx('swap');
  }
  e.preventDefault();
  return;
 }
 keyEdge(e.code);
  if(boundCodes.has(e.code))e.preventDefault();
});

cvs.addEventListener('mousedown',e=>{

 if(e.button===0&&state==='menu'&&!menuSettings){

   if(mouse.x>=g.input.x&&mouse.x<=g.input.x+g.input.w&&mouse.y>=g.input.y&&mouse.y<=g.input.y+g.input.h){nameTyping=true;}
   else if(mouse.x>=g.random.x&&mouse.x<=g.random.x+g.random.w&&mouse.y>=g.random.y&&mouse.y<=g.random.y+g.random.h){

    myName=cleanName(nameBuf);saveName();sfx('pickup');
   }
    else nameTyping=false;
   }
  }
 if(e.button===0&&state==='menu'&&modeOpen&&!menuSettings){
  const R=modeSelRects();
  const inR=(r)=>mouse.x>=r.x&&mouse.x<=r.x+r.w&&mouse.y>=r.y&&mouse.y<=r.y+r.h;
  if(inR(R.fill)){
   gameFill=!gameFill;

  }

   for(const row of R.rows){
    if(inR(row)){selectedMode=row.k;modeOpen=false;sfx('swap');break;}
   }

 }
  if(e.button===0&&(state==='menu'||state==='pause')&&(state==='menu'?menuSettings:(pauseTab==='settings'))&&settingsSub==='party'){
  const g=partyGeom();
  const inR=(r)=>mouse.x>=r.x&&mouse.x<=r.x+r.w&&mouse.y>=r.y&&mouse.y<=r.y+r.h;
  if(inR(g.input)){
   if(hostNaming)hostTyping=true;else partyTyping=true;
  }
  else if(inR(g.create)&&!net.role&&!hostNaming){if(!net.busy&&!net.peer){hostNaming=true;hostTyping=true;hostBuf='';}}
  else if(inR(g.join)&&!net.role){
   if(!net.busy){
    if(hostNaming)netHostStart(hostBuf);
    else if(partyBuf.length>=2)netJoinStart(partyBuf);
   }
  }
  else if(inR(g.leave)){hostNaming=false;hostTyping=false;}
 }

});

cvs.addEventListener('wheel',e=>{
 if(state!=='play'&&state!=='drop')return;
 if(net.role==='guest'){
  if(player&&player.alive){
   let i=player.cur;
   for(let k=0;k<7;k++){
    i+=e.deltaY>0?1:-1;if(i<-1)i=4;if(i>4)i=-1;
    if(i===-1||player.slots[i]){gAct.push({t:'cur',v:i});break;}
   }
  }
  e.preventDefault();
  return;
 }
 if(player&&player.alive)cycleSlot(player,e.deltaY>0?1:-1);
 e.preventDefault();
},{passive:false});

function keyEdge(code){
 if(net.role==='guest'){guestKeyServe(code);return;}
 if(state==='drop'&&player&&player.onboard&&BINDS.up.includes(code)){ejectAgent(player);}
 if(state!=='play'&&state!=='drop')return;
 if(!player||!player.alive)return;
   if(BINDS.slot1.includes(code)){exitBuild(player);selectSlot(player,0);}
  if(BINDS.slot2.includes(code)){exitBuild(player);selectSlot(player,1);}
  if(BINDS.slot3.includes(code)){exitBuild(player);selectSlot(player,2);}
  if(BINDS.slot4.includes(code)){exitBuild(player);selectSlot(player,3);}
  if(BINDS.slot5.includes(code)){exitBuild(player);selectSlot(player,4);}
  if(BINDS.pickaxe.includes(code)){player.build=false;player.cur=-1;sfx('swap');}
 if(BINDS.wall.includes(code)){enterBuild(player,'wall');}
 if(BINDS.floor.includes(code)){enterBuild(player,'floor');}
 if(BINDS.ramp.includes(code)){enterBuild(player,'ramp');}
 if(BINDS.cone.includes(code)){enterBuild(player,'cone');}
 if(BINDS.reload.includes(code)){startReload(player);}
  if(BINDS.drop.includes(code)){
   const s=player.cur>=0?player.slots[player.cur]:null;
   if(s){
    items.push({x:player.x+player.w/2,y:player.y+8,vy:-70,t:0,kind:(s.kind==='weapon'||WPN[s.t])?'weapon':s.t,w:s.t,r:s.r,noPick:0.9});
    if(s.n&&s.n>1)s.n--;else player.slots[player.cur]=null;
    sfx('swap');
   }
  }
  if(BINDS.potion.includes(code)){useShield(player);}
  if(BINDS.med.includes(code)){useMed(player);}
  if(BINDS.swap.includes(code)&&player.slots.indexOf(null)<0){trySwapWeapon();}
  if(BINDS.mat.includes(code)){cycleBuildMat(player);}
  if(BINDS.map.includes(code)){mapOpen=!mapOpen;sfx('swap');}
}

function partySizeCount(){
 let n=0;
 for(const m of net.members){
  if(!m.conn||m.conn.open)n++;
 }
 return n;
}
function partyAutoMode(announce){
 if(net.role!=='host')return null;
 const n=partySizeCount();
 const mode=(MODE_FOR_SIZE[n]||'squads');
 if(selectedMode!==mode){
  selectedMode=mode;
  if(announce)toast('PARTY SIZE '+n+' — GAME MODE: '+MODES[mode].name);
 }
 return mode;
}

function drawToasts(){
 for(let i=0;i<toasts.length;i++){
  const t=toasts[i];
  const y=SH-24-(toasts.length-i)*54;
  ctx.globalAlpha=Math.min(1,t.t*2);
  ctx.fillStyle='rgba(13,22,36,0.95)';
  const bw=360;
  rrPath(SW-16-bw,y,bw,46,10);ctx.fill();
  ctx.strokeStyle=t.c;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=t.c;ctx.font='bold 13px monospace';ctx.textAlign='left';
  ctx.fillText(t.txt,SW-16-bw+16,y+29);
  ctx.globalAlpha=1;
 }
 ctx.textAlign='left';
}

function isRedHue(hex){
 const n=parseInt(hex.slice(1),16);
 const r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
 if(d<0.0001)return false;
 let h;
 if(mx===r)h=((g-b)/d)%6;
 else if(mx===g)h=(b-r)/d+2;
 else h=(r-g)/d+4;
 h=(h*60+360)%360;
 return h<20||h>340;
}

function shade(hex,f){
 const n=parseInt(hex.slice(1),16);
 let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 r=Math.round(Math.min(255,Math.max(0,r*f)));g=Math.round(Math.min(255,Math.max(0,g*f)));b=Math.round(Math.min(255,Math.max(0,b*f)));
 return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

const LEVEL_ANCHORS=[[0,1],[6,5],[12,8],[15,25],[20,40],[30,50],[35,100]];
function levelFor(m){
 let M=Math.max(0,m|0),i=0;
 while(i<LEVEL_ANCHORS.length-1&&M>=LEVEL_ANCHORS[i+1][0])i++;
 if(i<LEVEL_ANCHORS.length-1){
  const a=LEVEL_ANCHORS[i],b=LEVEL_ANCHORS[i+1];
  return Math.min(b[1]-1,a[1]+Math.floor((M-a[0])*(b[1]-a[1])/(b[0]-a[0])));
 }
 return 100+Math.floor((M-35)/4);
}
function needToLevel(){
 let m=records.matches||0;
 const lvl=levelFor(m);
 let s=m;while(s>0&&levelFor(s-1)===lvl)s--;
 let c=m+1;while(levelFor(c)<lvl+1)c++;
 const span=c-s||1;
 return{lvl,into:m-s,per:span,left:c-m};
}

}

const net={enabled:'Peer' in window,role:null,peer:null,conns:[],members:[],code:'',busy:false,

const NET_PREFIX='fn2d2-';
function netCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function netSend(conn,obj){try{conn.send(obj);}catch(e){}}
function netBroadcast(obj){for(const c of net.conns)if(c.open)netSend(c,obj);}
function lobbyMembersWireless(){
 return net.members.map(m=>({name:m.name,host:!!m.host,ready:m.conn?!!(m.conn.ready):!!m.ready}));
}
function lobbySync(){netBroadcast({t:'lobby',code:net.code,members:lobbyMembersWireless()});}
function partyAllReady(){
 if(net.role!=='host')return false;
 for(const m of net.members){
  if(m.conn&&m.conn.open&&!m.conn.ready)return false;
 }
 return true;
}
function partyAllReadyCount(){
 let n=0;
 for(const m of net.members)if(m.conn?m.conn.ready:!!m.ready)n++;
 return n;
}
function netHostStart(custom){
 if(typeof Peer==='undefined'){net.err='Party needs internet (PeerJS failed to load)';return;}
 let code=(custom||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(code&&code.length<3){net.err='Party code needs 3-6 letters/numbers';return;}
 if(code.length>6)code=code.slice(0,6);
 if(!code)code=netCode();
 net.busy=true;net.err='';
 const usedCode=code;
 const p=new Peer(NET_PREFIX+usedCode,{debug:0});
 net.peer=p;

function placeBuild(a,px,py){

 if(a.placeCd>0)return;

 const reach=200;
 if(dist(a.x+a.w/2,a.y+a.h/2,cell.x+TILE/2,cell.y+TILE/2)>reach){sfx('deny');a.placeCd=0.25;return;}
 let occupied=false;
 const prect=a.buildPiece==='floor'?{x:cell.x,y:cell.y+TILE-12,w:TILE,h:12}:cell;
 eachSolid(cell.x,cell.y,cell.x+TILE,cell.y+TILE,s=>{
  if(!s.dead&&aabb(s,prect))occupied=true;
 });
 for(const o of agents){
  if(o===a||!o.alive||o.onboard)continue;

 }
 if(occupied){sfx('deny');a.placeCd=0.25;return;}
 a.mats[mat]-=10;
 const m=MATS[mat];
 let s;
 if(a.buildPiece==='wall')s=addStruct(cell.x,cell.y,TILE,TILE,mat,{built:true,kind:'built'});
 else if(a.buildPiece==='floor')s=addStruct(cell.x,cell.y+TILE-12,TILE,12,mat,{built:true,kind:'built',oneway:true});
 else if(a.buildPiece==='ramp')s=addStruct(cell.x,cell.y,TILE,TILE,mat,{built:true,kind:'built',shape:'slopeR'});
 else s=addStruct(cell.x,cell.y,TILE,TILE,mat,{built:true,kind:'built',shape:'slopeL'});
 sfx('build');
 spawnParts(cell.x+TILE/2,cell.y+TILE/2,5,m.c,100);

function bulletStep(b,dt){
  const steps=Math.ceil(Math.hypot(b.vx,b.vy)*dt/6);
 const sx=b.vx*dt/steps,sy=b.vy*dt/steps;
 for(let i=0;i<steps;i++){
  b.x+=sx;b.y+=sy;
  const s=solidAtPoint(b.x,b.y);
  if(s){
   damageStruct(s,b.dmg,b.owner);
   spawnParts(b.x,b.y,4,MATS[s.mat]?MATS[s.mat].c:'#aaa',120,500);
   return true;
  }
  for(const c of chests){
   if(!c.opened&&b.x>=c.x&&b.x<=c.x+c.w&&b.y>=c.y&&b.y<=c.y+c.h){openChest(c);return true;}
  }
  for(const a of agents){
   if(!a.alive||a.onboard||a===b.owner)continue;
   if(sameTeam(b.owner,a))continue;
   if(b.x>=a.x&&b.x<=a.x+a.w&&b.y>=a.y&&b.y<=a.y+a.h){
    const crit=rnd()<0.15;
    let dmg=b.dmg*(crit?1.5:1);
    damageAgent(a,dmg,b.owner,crit);
    spawnParts(b.x,b.y,crit?7:4,'#ef5350',150,600);
    if(b.owner&&b.owner.isPlayer){player.hitT=0;sfx(crit?'crit':'hit');}
    return true;
   }
  }
 }
 b.life-=dt;
 if(b.life<=0)return true;
 if(b.x<0||b.x>WORLD_W||b.y>WORLD_H||b.y<-200)return true;
 return false;
}

 a.hp-=dmg;
 dnum(a.x+a.w/2,a.y-6,Math.round(dmg)+(crit?'!':''),crit?'#ffd54f':'#fff');

function heightToGround(a){
 let x=a.x+a.w/2,y=a.y+a.h;
 for(let i=0;i<14;i++){
  y+=40;
  if(solidAtPoint(x,y))return y-(a.y+a.h);
  if(y>WORLD_H)return 9999;
 }
 return 9999;
}

function moveAgent(a,dt){
 const inW=waterAt(a.x+a.w/2,a.y+a.h-8);
 const g=inW?GRAV*0.22:GRAV;
 a.vy=Math.min(a.vy+g*dt,inW?260:(a.fast?1150:1400));
  if(inW&&a.isPlayer&&pressed('up'))a.vy=-240;
 if(!a.grounded&&!a.fast&&a.vy>300){
  const hg=heightToGround(a);
  if(hg<460)a.vy=lerp(a.vy,300,Math.min(1,dt*4));
 }
 const prevBottom=a.y+a.h;
 a.x+=a.vx*dt;
 a.x=clamp(a.x,0,WORLD_W-a.w);
 collideX(a);
 a.y+=a.vy*dt;
 const vyImpact=a.vy;
 a.grounded=false;
 collideY(a,prevBottom);
 if(a.grounded&&vyImpact>1000){
  const d=(vyImpact-1000)/9;
  damageAgent(a,d,null,false);
  spawnParts(a.x+a.w/2,a.y+a.h,6,'#ccc',100);
  sfx('land');
 }
}
function collideX(a){
 eachSolid(a.x,a.y,a.x+a.w,a.y+a.h,s=>{
  if(s.dead||s.shape!=='rect'||s.oneway)return;
  if(!aabb(a,s))return;
  if(a.vx>0)a.x=s.x-a.w;
  else if(a.vx<0)a.x=s.x+s.w;
  else a.x=s.x-a.w;
  a.vx=0;
 });
}
function collideY(a,prevBottom){
 eachSolid(a.x,a.y,a.x+a.w,a.y+a.h,s=>{
  if(s.dead)return;
  if(s.shape==='rect'){
   if(!aabb(a,s))return;
   if(s.oneway){
    if(a.vy>=0&&prevBottom<=s.y+8){a.y=s.y-a.h;a.vy=0;a.grounded=true;}
   }else{
    if(a.vy>0){a.y=s.y-a.h;a.vy=0;a.grounded=true;}
    else if(a.vy<0){a.y=s.y+s.h;a.vy=0;}
   }
  }else{
   if(a.vy<0)return;
   const cx=a.x+a.w/2;
   if(cx<s.x||cx>s.x+s.w)return;
   const top=slopeTopAt(s,cx);
   const bottom=a.y+a.h;
   if(bottom>=top&&prevBottom<=top+12){
    a.y=top-a.h;a.vy=0;a.grounded=true;
   }
  }
 });
}
function waterAt(x,y){
 for(const w of waters)if(x>=w.x&&x<=w.x+w.w&&y>=w.y&&y<=w.y+w.h)return true;
 return false;
}
const GRAV=2300;

function losClear(x1,y1,x2,y2){
 const d=dist(x1,y1,x2,y2);
 const steps=Math.ceil(d/55);
 for(let i=1;i<steps;i++){
  const t=i/steps;
  if(solidAtPoint(lerp(x1,x2,t),lerp(y1,y2,t)))return false;
 }
 return true;
}

function botThink(a){
 a.thinkT=0.16;
 if(a.dropping||a.onboard)return;
 if(a.calmT>0)a.calmT-=0.16;
 if(a.postCd>0)a.postCd-=0.16;
 a.tgtT-=0.16;
 let best=null,bd=1e9;
 if(a.calmT<=0&&a.postCd<=0&&rnd()<a.aggro){
  for(const o of agents){
   if(o===a||!o.alive||o.onboard||sameTeam(a,o))continue;
   const d=dist(a.x,a.y,o.x,o.y);
   if(d<340&&d<bd&&losClear(a.x+a.w/2,a.y+a.h/2,o.x+o.w/2,o.y+o.h/2)){bd=d;best=o;}
  }
 }
 if(best){a.tgt=best;a.tgtT=2.5;}
 else if(a.tgtT<=0){
  if(a.tgt)a.postCd=rr(2,4);
  a.tgt=null;
 }
 if(a.tgt&&!a.tgt.alive){
  a.postCd=rr(3,7);
  a.tgt=null;
 }
 let mvx=0,wantJump=false;
 const safeL=storm.lw+120,safeR=storm.rw-120;
 const cx=a.x+a.w/2;
 if(cx<storm.lw+70||cx>storm.rw-70){
  mvx=cx<(storm.lw+storm.rw)/2?1:-1;
  a.mvxBot=clamp(mvx,-1,1);
  a.wantJumpBot=false;
  return;
 }
 if(a.tgt){
  const t=a.tgt;
  const d=dist(a.x,a.y,t.x,t.y);
  a.aimA=Math.atan2((t.y+20)-(a.y+20),(t.x+t.w/2)-(a.x+a.w/2))+rr(-1,1)*(0.20-a.skill*0.09)+(a.recoil*0.02);
  const w=bestWeapon(a);
  const band=w?(w.t==='shotgun'?130:w.t==='sniper'?480:w.t==='smg'?230:w.t==='pistol'?260:320):40;
  if(a.hp+a.shield<50&&(a.med+a.potS+a.potB)>0&&d>250){
   a.tgt=null;
   mvx=cx<t.x?-1:1;
  }else if(a.hp+a.shield<40){
   mvx=cx<t.x?-1:1;
   if(a.healCd===undefined)a.healCd=0;
  }else{
   mvx=d>band+60?1:(d<band-60?-1:0);
   a.strafeT-=0.16;
   if(a.strafeT<=0){a.strafeT=rr(0.5,1.2);a.strafeDir=rnd()<0.5?-1:1;}
   mvx+=a.strafeDir*0.7;
   if(rnd()<0.02)wantJump=true;
   if(!w){
    if(d<80)swingPickaxe(a);
    else mvx=cx<t.x?-1.2:1.2;
   }else if(a.fireCd<=0&&a.reloadT<=0&&d<WPN[w.t].range*0.85&&rnd()<0.62){
    a.aimA+=rr(-1,1)*(0.08-a.skill*0.035);
    fireWeapon(a);
   }
   if(a.tookT<0.5&&a.wallCd<=0){
    const dir=t.x>a.x?1:-1;
    const cellX=Math.floor((a.x+a.w/2+dir*50)/TILE)*TILE;
    const cellY=Math.floor((a.y+a.h-20)/TILE)*TILE;
    if((a.mats.wood||0)>=10){
     a.buildMat='wood';
     const px=cellX+TILE/2,py=cellY+TILE/2;
     const savePiece=a.buildPiece;a.buildPiece='wall';
     placeBuild(a,px,py);
     a.buildPiece=savePiece;
    }
    a.wallCd=1.2;
   }
  }
 }else{
  const w=bestWeapon(a);
  if(w&&a.cur!==a.slots.indexOf(w)&&a.slots.indexOf(w)>=0){selectSlot(a,a.slots.indexOf(w));}
  if(cx<safeL)mvx=1;
  else if(cx>safeR)mvx=-1;
  else{
   let want=null,wd=1e9;
   const needWeapon=a.slots.every(s=>!s);
   const needAmmo=w&&a.ammo[WPN[w.t].ammo]<10;
   const needHeal=a.hp<65||a.shield<30;
   for(const it of items){
    if(it.taken)continue;
    const d=Math.abs(it.x-cx)+Math.abs(it.y-a.y)*0.5;
    if(d>700)continue;
    if(it.kind==='weapon'&&needWeapon&&d<wd){want=it;wd=d;}
    else if(it.kind==='ammo'&&needAmmo&&d<wd){want=it;wd=d;}
    else if((it.kind==='potS'||it.kind==='potB'||it.kind==='med')&&needHeal&&d<wd){want=it;wd=d;}
   }
   if(want){
    mvx=want.x>cx?1:-1;
    if(want.y<a.y-60&&a.grounded)wantJump=true;
   }else{
    if(!a.wanderX||Math.abs(a.wanderX-cx)<80||a.wanderT<=0){
     a.wanderX=clamp(rr(safeL,safeR),100,WORLD_W-100);
     a.wanderT=rr(2,5);
    }
    a.wanderT-=0.16;
    mvx=a.wanderX>cx?1:-0.9;
    if(rnd()<0.008)wantJump=true;
   }
  }
  a.aimA=mvx>0?0:(mvx<0?Math.PI:a.aimA);
  if(a.hp<70&&a.med>0&&!a.cast){useMed(a);}
  else if(a.shield<60&&(a.potS>0||a.potB>0)&&!a.cast){useShield(a);}
 }
 a.mvxBot=clamp(mvx,-1,1);
 a.wantJumpBot=wantJump;
}
function bestWeapon(a){
 let best=null,bv=-1;
 for(const w of a.slots){
  if(!w)continue;
  const def=WPN[w.t];
  const v=def.dmg*def.rps*RARITY[w.r].m;
  if(v>bv){bv=v;best=w;}
 }
 return best;
}

function updateAgent(a,dt){
 if(!a.alive)return;
 a.fireCd-=dt;a.placeCd-=dt;a.swingCd-=dt;a.wallCd-=dt;a.recoil=Math.max(0,a.recoil-dt*6);
 a.tookT+=dt;a.hitT+=dt;
 if(a.reloadT>0){
  a.reloadT-=dt;
  if(a.reloadT<=0)finishReload(a);
 }
 const cw=curWeapon(a);
 if(cw&&cw.mag<=0&&a.reloadT<=0&&a.ammo[WPN[cw.t].ammo]>0)startReload(a);
 if(a.cast){
  a.cast.t+=dt;
  if(a.cast.t>=a.cast.dur)applyCast(a);
 }
 if(a.human&&a.act&&a.act.length){
  const q=a.act;a.act=[];
  for(const m of q){
   if(m.t==='cur'){exitBuild(a);selectSlot(a,m.v);}
   else if(m.t==='piece'){enterBuild(a,m.p);}
   else if(m.t==='pickmode'){a.build=false;a.cur=-1;}

    if(s){items.push({x:a.x+a.w/2,y:a.y+8,vy:-70,t:0,kind:s.kind==='weapon'?'weapon':s.t,w:s.t,r:s.r,noPick:0.9});if(s.n&&s.n>1)s.n--;else a.slots[a.cur]=null;}
   }
   else if(m.t==='reload'){startReload(a);}
   else if(m.t==='use'){useHealSlotA(a,m.i);}
   else if(m.t==='swap'){trySwapAgent(a);}
   else if(m.t==='open'){
    let bc=null,bd=52;
    for(const ch of chests){
     if(ch.opened)continue;
     const d=dist(a.x+a.w/2,a.y+a.h/2,ch.x+ch.w/2,ch.y+ch.h/2);
     if(d<bd){bd=d;bc=ch;}
    }
    if(bc)openChest(bc);
   }
   else if(m.t==='jumpq'){ejectAgent(a);}
  }
 }
 if(a.onboard)return;
 const c=ctl(a);
 if(a.dropping){
   const dir=c?((c.lf?-1:0)+(c.rt?1:0)):(a.dropX>a.x+a.w/2?1:(a.dropX<a.x+a.w/2-10?-1:0));
   a.vx=lerp(a.vx,dir*260,Math.min(1,dt*3));
   a.fast=c?c.ft:(a.fast||false);
  a.vy=Math.min(a.vy+GRAV*dt,a.fast?1100:520);
  if(!a.fast){
   const hg=heightToGround(a);
   if(hg<420)a.vy=lerp(a.vy,280,Math.min(1,dt*5));
  }
  a.x=clamp(a.x+a.vx*dt,0,WORLD_W-a.w);
  a.y+=a.vy*dt;
  const prevBottom=a.y+a.h;
  a.grounded=false;
  collideY(a,prevBottom);
  if(a.grounded){
   a.dropping=false;
   spawnParts(a.x+a.w/2,a.y+a.h,8,'#cfd8dc',120);
   if(a.isPlayer)sfx('land');
  }
  if(c)a.aimA=Math.atan2(c.ly-(a.y+20),c.lx-(a.x+a.w/2));
  return;
 }
 let speed=330;
 if(c){

   it.vy+=900*dt;

   if(it.y>g-24){it.y=g-24;it.vy=0;}
  }
  for(const a of agents){
   if(!a.alive||a.onboard||a.dropping)continue;

   if(Math.abs(it.x-(a.x+a.w/2))>34||Math.abs(it.y-(a.y+a.h/2))>44)continue;
   if(it.kind==='ammo'){
    it.taken=true;a.ammo.light+=30;a.ammo.medium+=20;a.ammo.shells+=6;a.ammo.heavy+=3;
    if(a.isPlayer)sfx('pickup');
   }else if(it.kind==='fruit'){
    it.taken=true;
    const f=FRUIT[it.f];
    if(f.hp)a.hp=Math.min(100,a.hp+f.hp);
    if(f.sh)a.shield=Math.min(100,a.shield+f.sh);
    dnum(it.x,it.y-10,(f.hp?'+'+f.hp:'+'+f.sh),f.hp?'#7CFC00':'#4FC3F7');
    if(a.isPlayer)sfx('fruit');
    }else if(it.kind==='potS'||it.kind==='potB'||it.kind==='med'){
     if(a.isPlayer||a.human){
      const stack=a.slots.findIndex(s=>s&&s.t===it.kind&&(s.n||1)<3);
      if(stack>=0){
       it.taken=true;
       a.slots[stack].n=(a.slots[stack].n||1)+1;
       sfx('pickup');
      }else{
       const slot=a.slots.indexOf(null);
       if(slot>=0){
        it.taken=true;
        a.slots[slot]={t:it.kind,r:'heal',n:1};
        sfx('pickup');
       }
      }
     }else{
     it.taken=true;
     if(it.kind==='potS')a.potS++;else if(it.kind==='potB')a.potB++;else a.med++;
    }
    }else if(it.kind==='mats'){
     it.taken=true;a.mats[it.m]=Math.min(500,(a.mats[it.m]||0)+it.n);
     if(a.isPlayer)sfx('pickup');
    }else if(it.kind==='vt'){
     if(a.isPlayer||a.human){
      it.taken=true;
      if(a.isPlayer){awardVt(10);sfx('pickup');}
      else{
       const c=net.conns.find(x=>x.open&&x.agent===a);
       if(c)netSend(c,{t:'vt',n:10});
      }
     }
     }else if(it.kind==='weapon'){
    const slot=a.slots.indexOf(null);
    if(slot>=0){
     it.taken=true;
     a.slots[slot]={t:it.w,r:it.r,kind:'weapon',mag:WPN[it.w].mag};
     if(a.cur===-1&&!a.build)a.cur=slot;
     if(a.isPlayer)sfx('pickup');
    }
   }
  }
 }
 items=items.filter(it=>!it.taken);
 for(const c of chests){
  if(c.opened)continue;

function trySwapWeapon(){
 if(!player||!player.alive)return;
 const cx=player.x+player.w/2,cy=player.y+player.h/2;
 let best=null,bd=60;
 for(const it of items){
  if(it.taken||it.kind!=='weapon')continue;
  const d=dist(cx,cy,it.x,it.y);
  if(d<bd){bd=d;best=it;}
 }
 if(!best)return;
  const old=player.cur>=0?player.slots[player.cur]:null;
  if(old)items.push({x:cx,y:cy,vy:-80,kind:(old.kind==='weapon'||WPN[old.t])?'weapon':old.t,w:old.t,r:old.r,t:0});
  player.slots[player.cur<0?0:player.cur]={t:best.w,r:best.r,kind:'weapon',mag:WPN[best.w].mag};
 if(player.cur<0)player.cur=0;
 best.taken=true;
 sfx('swap');
}

function updateCam(dt){
 let fx,fy;
 if(state==='drop'&&player&&player.onboard){fx=bus.x;fy=bus.y;}
 else if(player){fx=player.x+player.w/2;fy=player.y+player.h/2;}
 else{fx=cam.x+SW/2;fy=cam.y+SH/2;}
 const zoomT=mouse.r&&state==='play'&&player.alive?(curWeapon(player)&&curWeapon(player).t==='sniper'?1.5:1.28):1;
 cam.zoom=lerp(cam.zoom,zoomT,Math.min(1,dt*6));
 const scale=(SH/WORLD_H)*cam.zoom;
 const vw=SW/scale,vh=SH/scale;
 const lookX=player&&!player.onboard?clamp((mouse.x-SW/2)*0.15,-140,140):0;
 cam.x=lerp(cam.x,fx-vw/2+lookX,Math.min(1,dt*8));
 cam.y=lerp(cam.y,fy-vh/2,Math.min(1,dt*8));
 cam.x=clamp(cam.x,0,WORLD_W-vw);
 cam.y=clamp(cam.y,0,WORLD_H-vh);
 cam.shake=Math.max(0,cam.shake-dt*30);
 mouse.wx=cam.x+mouse.x/scale;
 mouse.wy=cam.y+mouse.y/scale;
}

function update(dt){
 if(state==='menu'){updateMenu(dt);return;}
 if(state==='end')return;
 if(state==='pause')return;
 if(net.role==='guest'){records.playT+=dt;updateGuestNet(dt);return;}
 if(state==='play'||state==='drop')records.playT+=dt;
 matchT+=dt;
 if(bus.x<WORLD_W+600)bus.x+=bus.v*dt;
 for(const a of agents){
  if(a.onboard&&!a.isPlayer&&bus.x>=a.dropX)ejectAgent(a);
 }
 if(bus.x>WORLD_W+400){
  for(const a of agents)if(a.onboard)ejectAgent(a);
 }
 if(state==='drop'&&player&&!player.onboard)state='play';
 for(const a of agents)updateAgent(a,dt);
 updateBullets(dt);
 updateItems(dt);
 updateStorm(dt);
 updateFX(dt);
 updateCam(dt);
 aliveCount=agents.filter(a=>a.alive).length;
 const tAlive=new Set();
 for(const a of agents)if(a.alive)tAlive.add(a.teamId===undefined?1000+agents.indexOf(a):a.teamId);
  if(tAlive.size<=1&&state!=='end'&&state!=='menu'){
  state='end';
   const win=agents.find(a=>a.alive);
   const playerAlive=win&&player&&player.alive&&sameTeam(win,player);
   if(win&&(win.isPlayer||(win.human&&win.teamId===0)||playerAlive)){
    records.best=records.best||1;
    if(!records.best||records.best>1)records.best=1;
    records.bestKills=Math.max(records.bestKills,player.kills);
    records.wins++;
    sfx('win');
    }else sfx('lose');
    const prevLvl=needToLevel().lvl;
    records.matches++;
    saveRecords();
    checkLevelUp(prevLvl);
   if(net.role==='host'){
    for(const c of net.conns){
     if(!c.open)continue;
     const won=win===c.agent;
     netSend(c,{t:'end',win:won,place:won?1:(c.agent.placement||aliveCount+1),kills:c.agent.kills,dth:c.agent.alive?0:1});
    }
    const gg=streamGen;
    setTimeout(()=>{if(streamGen===gg)netStreamStop();},4000);
  }
 }
 if(player&&!player.alive&&!player.placement)player.placement=aliveCount+1;
 if(mouse.lEdge)mouse.lEdge=false;
 if(mouse.rEdge)mouse.rEdge=false;
}

function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,SH);
 g.addColorStop(0,'#4a90d9');g.addColorStop(0.7,'#8ec9e8');g.addColorStop(1,'#c8e8f0');
 ctx.fillStyle=g;ctx.fillRect(0,0,SW,SH);
 ctx.fillStyle='rgba(255,240,200,0.9)';
 ctx.beginPath();ctx.arc(SW*0.8,SH*0.16,46,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,0.75)';
 for(const c of clouds){
  const scale=(SH/WORLD_H)*cam.zoom;
  const sx=(c.x-cam.x*0.4)*scale,sy=c.y*scale;
  if(sx<-200||sx>SW+200)continue;
  ctx.beginPath();
  ctx.ellipse(sx,sy,60*c.s,18*c.s,0,0,7);
  ctx.ellipse(sx+40*c.s,sy-10*c.s,40*c.s,14*c.s,0,0,7);
  ctx.ellipse(sx-40*c.s,sy-6*c.s,34*c.s,12*c.s,0,0,7);

 }

function drawWorld(scale){
 const vx0=cam.x-60,vx1=cam.x+SW/scale+60,vy0=cam.y-60,vy1=cam.y+SH/scale+60;
 for(const w of waters){
  if(w.x+w.w<vx0||w.x>vx1)continue;
  ctx.fillStyle='rgba(30,120,190,0.75)';
  ctx.fillRect(w.x,w.y,w.w,w.h);
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;
  ctx.beginPath();
  for(let x=w.x;x<=w.x+w.w;x+=8)ctx.lineTo(x,w.y+Math.sin(x*0.05+matchT*2)*3);
  ctx.stroke();
 }
 for(const s of structs){
  if(s.dead||s.x+s.w<vx0||s.x>vx1||s.y+s.h<vy0||s.y>vy1)continue;
  if(s.shape==='slopeR'||s.shape==='slopeL'){
   ctx.fillStyle='#8d6e63';
   ctx.beginPath();
   if(s.shape==='slopeR'){ctx.moveTo(s.x,s.y+s.h);ctx.lineTo(s.x+s.w,s.y);}
   else{ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+s.w,s.y+s.h);}
   ctx.lineTo(s.x+s.w,s.y+s.h);ctx.closePath();ctx.fill();
   ctx.strokeStyle='#66bb6a';ctx.lineWidth=5;
   ctx.beginPath();
   if(s.shape==='slopeR'){ctx.moveTo(s.x,s.y+s.h);ctx.lineTo(s.x+s.w,s.y);}
   else{ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+s.w,s.y+s.h);}
   ctx.stroke();ctx.lineWidth=1;
   continue;
  }
  if(s.mat==='terrain'){
   ctx.fillStyle='#8d6e63';ctx.fillRect(s.x,s.y,s.w,s.h);
   ctx.fillStyle='#66bb6a';ctx.fillRect(s.x,s.y,s.w,Math.min(12,s.h));
  }else if(s.mat==='rock'){
   ctx.fillStyle='#78909c';ctx.fillRect(s.x,s.y,s.w,s.h);
   ctx.fillStyle='#90a4ae';ctx.fillRect(s.x+4,s.y+4,s.w-8,6);
  }else{
   const m=MATS[s.mat];
   ctx.fillStyle=m?m.c:'#888';
   ctx.fillRect(s.x,s.y,s.w,s.h);
   ctx.fillStyle=m?m.dc:'#666';
   if(s.shape==='rect')ctx.fillRect(s.x,s.y+s.h-4,s.w,4);
   if(!s.indest&&s.hp<s.max*0.999){
    ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=2;
    const fr=1-s.hp/s.max;
    ctx.beginPath();
    ctx.moveTo(s.x+s.w*0.3,s.y);ctx.lineTo(s.x+s.w*0.5,s.y+s.h*0.5*fr+4);ctx.lineTo(s.x+s.w*0.7,s.y+s.h);
    ctx.stroke();
   }
  }
 }
 for(const t of trees){
  if(t.hp<=0||t.x<vx0-80||t.x>vx1+80)continue;
  ctx.fillStyle='#795548';
  ctx.fillRect(t.x-7,t.y-t.h*0.5,14,t.h*0.5);
  const sw=Math.sin(matchT*1.2+t.sway)*4;
  ctx.fillStyle=t.hp>75?'#43a047':'#6d4c41';
  ctx.beginPath();ctx.arc(t.x+sw,t.y-t.h*0.62,t.r*0.8,0,7);ctx.arc(t.x+sw-t.r*0.5,t.y-t.h*0.5,t.r*0.55,0,7);ctx.arc(t.x+sw+t.r*0.5,t.y-t.h*0.5,t.r*0.55,0,7);ctx.fill();
 }
 for(const c of chests){
  if(c.opened||c.x+c.w<vx0||c.x>vx1)continue;
  const pulse=0.5+0.5*Math.sin(matchT*4);
  ctx.fillStyle='rgba(64,196,255,'+(0.12+pulse*0.12)+')';
  ctx.beginPath();ctx.arc(c.x+c.w/2,c.y+c.h/2,34+pulse*6,0,7);ctx.fill();
  ctx.fillStyle='#8d6e63';ctx.fillRect(c.x,c.y,c.w,c.h);
  ctx.fillStyle='#ffd54f';ctx.fillRect(c.x,c.y+c.h*0.35,c.w,5);
  ctx.fillStyle='#6d4c41';ctx.fillRect(c.x,c.y,c.w,8);
 }
 for(const it of items){

 }
 for(const a of agents){

 }
 if(state==='drop'&&bus.x<WORLD_W+500)drawBus();
 ctx.lineWidth=3;
 for(const b of bullets){
  ctx.strokeStyle=RARITY[b.r]?RARITY[b.r].c:'#fff';
  ctx.globalAlpha=0.9;
  ctx.beginPath();
  ctx.moveTo(b.x,b.y);
  ctx.lineTo(b.x-b.vx*0.012,b.y-b.vy*0.012);

 }

 }
 ctx.globalAlpha=1;
 drawStormWalls();
 for(const d of dnums){

function drawGunShape(x,y,t,c){

 if(t==='ar'){ctx.fillRect(x,y+4,30,6);ctx.fillRect(x+6,y,6,6);ctx.fillRect(x+2,y+10,5,8);}
 else if(t==='smg'){ctx.fillRect(x,y+4,22,7);ctx.fillRect(x+4,y+11,5,7);ctx.fillRect(x-3,y+5,4,4);}
 else if(t==='shotgun'){ctx.fillRect(x,y+5,34,6);ctx.fillRect(x+8,y+2,10,4);ctx.fillRect(x+4,y+11,5,7);}
 else if(t==='sniper'){ctx.fillRect(x,y+6,40,4);ctx.fillRect(x+10,y+1,10,4);ctx.fillRect(x+4,y+10,5,9);}
 else{ctx.fillRect(x+4,y+4,16,6);ctx.fillRect(x+4,y+10,5,7);}

 ctx.closePath();

function settingsClicks(){

   if(pauseHit({x:SW/2-110,y:y1+120,w:220,h:44})){settingsSub='party';partyTyping=false;hostNaming=false;hostTyping=false;sfx('swap');return 'handled';}
   if(pauseHit({x:SW/2-110,y:y1+180,w:220,h:44})){settingsSub='adminpw';adminPwBuf='';adminPwErr='';sfx('swap');return 'handled';}
   if(pauseHit({x:SW/2-110,y:y1+240,w:220,h:44})){sfx('swap');return 'back';}
   return 'none';
  }
 if(settingsSub==='keys'){
  const g=aiGeom();
  for(const b of g.slots){
   if(pauseHit(b)){rebindA=b.a;rebindSlot=b.s;sfx('swap');return 'handled';}
  }
  if(pauseHit(g.reset)){BINDS=JSON.parse(JSON.stringify(DEFAULT_BINDS));saveBinds();rebuildBoundCodes();rebindA=null;rebindSlot=-1;sfx('pickup');return 'handled';}
  if(pauseHit(g.back)){settingsSub=null;rebindA=null;rebindSlot=-1;sfx('swap');return 'handled';}
  return 'none';
 }
   if(settingsSub==='party'){
    const g=partyGeom();
    if(pauseHit(g.leave)){
     if(hostNaming){hostNaming=false;hostTyping=false;return 'handled';}
     partyTyping=false;settingsSub=null;sfx('swap');return 'handled';
    }
    if(!hostNaming&&!net.role){
     if(pauseHit(g.create)){if(!net.busy&&!net.peer)hostNaming=true;return 'handled';}
     if(pauseHit(g.input)){partyTyping=true;return 'handled';}
     if(pauseHit(g.join)){
      if(!net.busy&&partyBuf.length>=2)netJoinStart(partyBuf);
      return 'handled';
     }
    }else if(hostNaming&&!net.role){
     if(!net.busy&&pauseHit(g.join))netHostStart(hostBuf);
     return 'handled';
    }else{
     if(pauseHit(g.disband)){
      if(net.role==='host')netDisband();
      else{
       try{netSend(net.conns[0],{t:'bye'});}catch(e){}
       teardownGuest();
       net.role=null;net.conns=[];net.members=[];net.code='';
      }
      return 'handled';
     }
    }
    return 'none';
   }
  if(settingsSub==='visuals'){
   const g=visualsGeom();
  if(pauseHit(g.cb)){
   visuals.cb=CB_MODES[(CB_MODES.indexOf(visuals.cb)+1)%CB_MODES.length];
   saveVisuals();applyVisuals();sfx('swap');return 'handled';
  }
   if(pauseHit(g.back)){settingsSub=null;sfx('swap');return 'handled';}
   return 'none';
  }
  if(settingsSub==='adminpw'){
   const g=adminPwGeom();
   if(pauseHit(g.eye)){
    adminShow=!adminShow;sfx('swap');
   }
   else if(pauseHit({x:SW/2-120,y:g.by+g.ph-58,w:240,h:44})){
    adminPwBuf='';adminPwErr='';adminShow=false;settingsSub=null;sfx('swap');
   }
   return 'handled';
  }
  if(settingsSub==='admin'){
   const g=adminGeom();
   if(pauseHit(g.vt500)){awardVt(500);sfx('pickup');return 'handled';}
   if(pauseHit(g.vt5000)){awardVt(5000);sfx('win');return 'handled';}
   if(pauseHit(g.games10)||pauseHit(g.games100)||pauseHit(g.games1000)){
    const n=pauseHit(g.games10)?10:pauseHit(g.games100)?100:1000;
    const prevLvl=needToLevel().lvl;
    records.matches+=n;saveRecords();checkLevelUp(prevLvl);
    sfx('swap');return 'handled';
   }
   if(pauseHit(g.rb)){
    wardrobe.rb=!wardrobe.rb;wardrobe.rbOn=wardrobe.rb;saveWardrobe();
    sfx(wardrobe.rb?'win':'swap');return 'handled';
   }
   if(pauseHit(g.reset)){
    records={best:0,bestKills:0,matches:0,wins:0,deaths:0,playT:0};
    saveRecords();
    sfx('empty');return 'handled';
   }
   if(pauseHit(g.back)){settingsSub=null;sfx('swap');return 'handled';}
   return 'none';
  }
 return 'none';
}
function handleClicks(){
 if(state==='pause'){
  if(pauseTab==='settings'){
   const r=settingsClicks();
   if(r==='back')pauseTab='main';
   return;
  }
  const y1=Math.floor(SH*0.42);
  if(pauseHit({x:SW/2-110,y:y1,w:220,h:44})){state=pausePrev||'play';sfx('swap');}
   else if(pauseHit({x:SW/2-110,y:y1+60,w:220,h:44})){pauseTab='settings';settingsSub=null;rebindA=null;rebindSlot=-1;sfx('swap');}
   else if(pauseHit({x:SW/2-110,y:y1+120,w:220,h:44})){state='menu';mouse.lEdge=false;sfx('swap');}
  return;
 }
   if(state==='menu'){
    if(menuSettings){
     const r=settingsClicks();
     if(r==='back')menuSettings=false;
     mouse.lEdge=false;
     return;
    }
    const R=menuBtnRects();
    if(pauseHit(R.careerTab)){
     careerOpen=!careerOpen;
      if(careerOpen){lockerOpen=false;modeOpen=false;partyTyping=false;shopOpen=false;achOpen=false;}
     mouse.lEdge=false;
     sfx('swap');
     return;
    }
    if(pauseHit(R.lockTab)){
     lockerOpen=!lockerOpen;
     if(lockerOpen){modeOpen=false;careerOpen=false;partyTyping=false;shopOpen=false;achOpen=false;}
     mouse.lEdge=false;
     sfx('swap');
     return;
    }
    if(pauseHit(R.itemTab)){
     shopOpen=!shopOpen;
     if(shopOpen){lockerOpen=false;careerOpen=false;modeOpen=false;nameOpen=false;partyTyping=false;achOpen=false;}
     mouse.lEdge=false;
     sfx('swap');
     return;
    }
    if(pauseHit(R.achTab)){
     achOpen=!achOpen;
     if(achOpen){careerOpen=false;shopOpen=false;lockerOpen=false;modeOpen=false;nameOpen=false;partyTyping=false;}
     mouse.lEdge=false;
     sfx('swap');
     return;
    }
    if(careerOpen){
     mouse.lEdge=false;
     sfx('swap');
     return;
    }
    if(achOpen){
     mouse.lEdge=false;
     sfx('swap');
     return;
    }
    if(lockerOpen){
     const g=lockerGeom();
     for(let row=0;row<2;row++){
      for(let i=0;i<LOCKER_COLORS.length;i++){
       const sx=g.bx+110+i*(g.sw+g.gap),sy=g.by+66+row*(g.sw+40);
       if(mouse.x>=sx&&mouse.x<=sx+g.sw&&mouse.y>=sy&&mouse.y<=sy+g.sw&&!isRedHue(LOCKER_COLORS[i])){
        if(row===0)wardrobe.p=LOCKER_COLORS[i];else wardrobe.a=LOCKER_COLORS[i];
        if(wardrobe.rb&&wardrobe.rbOn)wardrobe.rbOn=false;
        saveWardrobe();sfx('pickup');
       }
      }
     }
     const rsx=g.bx+110,rsy=g.by+66+2*(g.sw+40);
     if(mouse.x>=rsx&&mouse.x<=rsx+g.sw&&mouse.y>=rsy&&mouse.y<=rsy+g.sw){
      if(wardrobe.rb){wardrobe.rbOn=!wardrobe.rbOn;saveWardrobe();sfx('pickup');}
      else sfx('empty');
     }
     mouse.lEdge=false;
     return;
    }
    if(shopOpen){
     const g=shopGeom();
     if(!wardrobe.rb&&mouse.x>=g.buy.x&&mouse.x<=g.buy.x+g.buy.w&&mouse.y>=g.buy.y&&mouse.y<=g.buy.y+g.buy.h){
      if(vtrucks>=VT_PRICE){
       vtrucks-=VT_PRICE;saveVt();
       wardrobe.rb=true;wardrobe.rbOn=true;saveWardrobe();
       sfx('win');
      }else sfx('empty');
     }else if(wardrobe.rb&&mouse.x>=g.sell.x&&mouse.x<=g.sell.x+g.sell.w&&mouse.y>=g.sell.y&&mouse.y<=g.sell.y+g.sell.h){
      awardVt(Math.floor(VT_PRICE/2));
      wardrobe.rb=false;wardrobe.rbOn=false;saveWardrobe();
      sfx('swap');
     }else if(wardrobe.rb&&mouse.x>=g.buy.x&&mouse.x<=g.buy.x+g.buy.w&&mouse.y>=g.buy.y&&mouse.y<=g.buy.y+g.buy.h){
      wardrobe.rbOn=!wardrobe.rbOn;saveWardrobe();sfx('swap');
     }
     mouse.lEdge=false;
     return;
    }
    if(modeOpen){
     mouse.lEdge=false;
     return;
    }
    if(pauseHit(R.mode)){
     modeOpen=!modeOpen;
     mouse.lEdge=false;
     sfx('swap');
     return;
    }
    if(pauseHit(R.party)){
    menuSettings=true;settingsSub='party';partyTyping=false;hostNaming=false;hostTyping=false;
    mouse.lEdge=false;
    sfx('swap');
    return;
   }
   if(pauseHit(R.ready)){
    readyToggle();
    mouse.lEdge=false;
    return;
   }
   if(pauseHit(R.play)){
    if(!menuReady)readyToggle();
    mouse.lEdge=false;
    return;
   }
   mouse.lEdge=false;
   return;
  }
  if(state==='end'){
   const winner=agents.find(a=>a.alive);
   if(winner&&winner.isPlayer)startMatch();
   else{state='menu';mouse.lEdge=false;}
   return;
  }
  if(player&&!player.alive){state='menu';mouse.lEdge=false;return;}
 if(player&&player.buildMenu&&buildZones.length){
  for(const z of buildZones){
   if(mouse.x>=z.x&&mouse.x<=z.x+z.w&&mouse.y>=z.y&&mouse.y<=z.y+z.h){
    if(z.piece)enterBuild(player,z.piece);
    if(z.mat){player.buildMat=z.mat;sfx('swap');}
    return;
   }
  }
 }
}
let lastT=0;
function frame(t){
 const dt=Math.min(0.05,(t-lastT)/1000||0.016);
 lastT=t;
 cvs.style.cursor=(state==='play'||state==='drop')?'none':'default';
 try{
   if(mouse.lEdge&&state!=='play'&&state!=='drop')handleClicks();
   else if(mouse.lEdge&&player&&!player.alive)handleClicks();
   else if(mouse.lEdge&&player&&player.buildMenu)handleClicks();
    update(dt);
   toasts=toasts.filter(t2=>{t2.t-=dt;return t2.t>0;});
   if(state!=='menu')draw();
   else draw();
   if(toasts.length)drawToasts();
 }catch(err){
  if(window.__TEST__){window.__TEST_ERR=err;throw err;}
  console.error(err);
 }
 mouse.lEdge=false;mouse.rEdge=false;
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.G={
 get state(){return state;},
 get player(){return player;},
 get agents(){return agents;},
 get storm(){return storm;},
 get bus(){return bus;},
 get feed(){return feed;},
 get alive(){return aliveCount;},
 get matchT(){return matchT;},
 keys,mouse,
 start:startMatch,
 setKey:(c,v)=>{keys[c]=v;},
 pressKey:c=>{keys[c]=true;keyEdge(c);keys[c]=false;},
 setMouse:(x,y)=>{mouse.x=x;mouse.y=y;},
 setBtn:(l,r)=>{mouse.l=l;mouse.r=r;},
 clickEdge:()=>{mouse.lEdge=true;},
 smite:i=>{if(agents[i]&&agents[i].alive)damageAgent(agents[i],99999,null,false);},
 get items(){return items.length;},
 get chests(){return chests.length;},
 get structs(){return structs.length;}
};
if(window.__TEST__){srand(424242);}
</script>
